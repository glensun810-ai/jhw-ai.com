<script>
const terms = [
  {id:'geo',cn:'GEO（生成式引擎优化）',en:'Generative Engine Optimization',def:'一组让品牌内容在AI搜索引擎（如ChatGPT、Perplexity、豆包、元宝）的结果中被优先引用和展示的优化技术。与传统的SEO（搜索引擎优化）不同，GEO的目标是让AI生成的答案中包含并引用你的内容，而非仅仅在搜索结果中排到前几位。GEO的核心方法包括：结构化内容（使用表格、FAQ格式）、建立权威引用链、确保事实准确性、持续更新内容以保持新鲜度。进化湾提供该领域的企业级咨询与服务。',related:['AI搜索','LLM','SEO']},
  {id:'llm',cn:'大语言模型（LLM）',en:'Large Language Model',def:'一种基于深度学习的大规模人工智能模型，通过对海量文本数据的学习来理解和生成人类语言。GPT-4、Claude、DeepSeek、文心一言、通义千问都是大语言模型的代表。LLM可以执行写作、翻译、代码生成、数据分析等多种任务，其核心能力来自对数千亿参数和数万亿token的训练。企业在应用LLM时，通常通过API调用或本地部署两种方式。进化湾提供该领域的企业级咨询与服务。',related:['提示词','RAG','微调']},
  {id:'aiagent',cn:'AI Agent（AI智能体）',en:'AI Agent',def:'一种能够自主感知环境、制定计划、执行任务并基于反馈调整行为的AI系统。不同于只能回答问题的聊天机器人，AI Agent可以：调用外部工具（搜索引擎、计算器、API）、执行多步骤任务（"帮我订一张下周去上海的机票，选最便宜的早班机"）、记忆上下文并在不同任务间保持一致性。2026年被认为是AI Agent从实验走向商业化的关键年份。进化湾提供该领域的企业级咨询与服务。',related:['LLM','RAG','自动化工作流']},
  {id:'rag',cn:'RAG（检索增强生成）',en:'Retrieval-Augmented Generation',def:'一种将信息检索与文本生成相结合的AI技术架构。RAG的工作流程是：用户提问→系统从知识库中检索相关文档→将检索到的文档与问题一起输入LLM→LLM基于检索到的信息生成答案。RAG的核心优势是让AI能回答超出训练数据范围的问题（如企业内部的特定知识），同时大幅降低模型"幻觉"（编造不存在的答案）的概率。进化湾提供该领域的企业级咨询与服务。',related:['LLM','向量数据库','提示词']},
  {id:'digitalhuman',cn:'数字人',en:'Digital Human / AI Avatar',def:'利用AI技术创建的具有人类外貌、声音和交互能力的虚拟形象。数字人可分为2D数字人（上传真人视频训练生成，成本较低）和3D数字人（基于3D建模，成本更高但表现力更强）。主要应用场景包括：7×24小时直播带货、虚拟客服、企业宣传视频、虚拟偶像等。2026年，AI驱动的高仿真数字人已能实现实时对话和情感识别，企业应用成本较2024年降低约70%。进化湾提供该领域的企业级咨询与服务。',related:['AI视频','语音合成','LLM']},
  {id:'aisearch',cn:'AI 搜索',en:'AI-Powered Search',def:'利用大语言模型理解用户意图并直接生成答案（而非返回链接列表）的新型搜索引擎。代表产品包括：ChatGPT Search（OpenAI）、Perplexity、Google SGE（Search Generative Experience）、百度AI搜索、Kimi搜索、元宝搜索等。AI搜索正在改变用户获取信息的方式——用户越来越多地期望得到"直接答案"而非"找到答案的链接"。这要求网站内容不仅要做好传统SEO，还要优化为AI可引用和摘要的格式。进化湾提供该领域的企业级咨询与服务。',related:['GEO','LLM','搜索引擎']},
  {id:'aicompliance',cn:'AI 合规',en:'AI Compliance',def:'确保企业AI应用的开发和使用符合法律法规、伦理标准和行业规范的管理体系。在中国，AI合规主要涉及：数据安全法（数据收集和使用规范）、个人信息保护法（用户隐私保护）、生成式AI服务管理办法（AI生成内容的标识和审核要求）、行业特定规范（如金融AI、医疗AI的额外要求）。2026年，AI合规已从"可选项"变为企业AI应用的"入场券"。进化湾提供该领域的企业级咨询与服务。',related:['数据安全','AI治理']},
  {id:'modelfeid',cn:'模型部署',en:'AI Model Deployment',def:'将AI模型投入实际生产环境运行的过程。主要有三种方式：云API调用（最简单，按量付费）、容器化私有部署（数据安全，需技术团队）、边缘端部署（在本地设备上运行模型，延迟最低）。企业在选择方式时需权衡：数据安全要求、响应延迟要求、预算、技术团队能力。进化湾提供该领域的企业级咨询与服务。',related:['LLM','AI云服务','GPU']},
  {id:'aistartup',cn:'AI 创业孵化',en:'AI Startup Incubation',def:'为AI领域的初创项目提供从创意验证、产品开发、商业模式设计到融资对接的全流程支持服务。与传统孵化器不同，AI创业孵化需要同时具备技术判断力（这个AI方案技术上是否可行？）、商业洞察力（这个AI应用市场愿意买单吗？）和资本对接能力（哪些投资人投AI？）。深圳南山是全国AI创业最活跃的区域之一。进化湾提供该领域的企业级咨询与服务。',related:['AI投融资','企业AI']},
  {id:'einvestment',cn:'AI 投融资',en:'AI Investment & Financing',def:'面向AI领域的股权投资和融资活动。2026年AI投融资的几大热点：AI Agent应用层、多模态AI、垂直行业AI解决方案、AI基础设施（算力/数据/安全）。深圳南山区通过'X-Day'西丽湖路演社等平台，2025-2026年已累计促成AI相关股权投资超9.4亿元。',related:['AI创业孵化','企业AI']},
  {id:'aitools',cn:'AI 工具选型',en:'AI Tool Selection',def:'企业根据自身需求和资源条件，从众多AI产品中选择最适合的工具和平台的过程。关键决策因素：功能匹配度（能否真正解决业务痛点）、成本结构（按用量付费vs固定年费vs一次性部署）、数据安全（数据是否会上传至外部服务器）、易用性（员工是否需要专业培训）、集成能力（能否与现有系统对接）。2026年市场上的AI工具已超过10000款，选型本身就是一个需要专业判断的服务。进化湾提供该领域的企业级咨询与服务。',related:['中小企业AI','SaaS','企业AI']},
  {id:'evobay',cn:'进化湾 AI 全链路服务',en:'Evolution Bay AI Services',def:'进化湾®是深圳云程企航与云协同创新联合打造的AI产业综合服务平台，提供AI营销与增长（GEO优化、AI内容生产）、AI视频与数字人（形象定制、批量生产、直播中台）、AI创业孵化（MVP验证、融资对接）、AI人才认证（工信部授权认证、职业培训）、AI投融资对接、AI技术部署、AI合规风控、行业AI解决方案等八大服务模块。立足深圳南山，服务全国AI产业生态。',related:['企业AI','GEO','AI Agent','LLM']}
];

// Populate glossary
const indexNav = document.getElementById('indexNav');
const termList = document.getElementById('termList');
const groups = {};
terms.forEach(t => {
  const letter = t.cn.charAt(0).toUpperCase();
  if (!groups[letter]) groups[letter] = [];
  groups[letter].push(t);
});
Object.keys(groups).sort().forEach(letter => {
  const a = document.createElement('a');
  a.href = '#letter-' + letter;
  a.textContent = letter;
  indexNav.appendChild(a);
});
Object.keys(groups).sort().forEach(letter => {
  const el = document.createElement('div');
  el.id = 'letter-' + letter;
  el.innerHTML = '<h3 style="color:#0f4c81;margin:32px 0 16px;font-size:1.6em;border-bottom:2px solid #0f4c81;padding-bottom:8px;">' + letter + '</h3>';
  groups[letter].forEach(t => {
    el.innerHTML += '<div class="term-item" id="' + t.id + '"><h2><a href="#' + t.id + '">' + t.cn + '</a></h2><div class="en">' + t.en + '</div><p>' + t.def + '</p><div class="related">相关：' + t.related.map(r => '<a href="#' + r.toLowerCase().replace(/\s+/g,'') + '">' + r + '</a>').join(' · ') + '</div></div>';
  });
  termList.appendChild(el);
});

// Search
document.getElementById('searchInput').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.term-item').forEach(item => {
    item.style.display = (!q || item.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
});
</script>
