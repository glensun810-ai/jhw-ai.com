<script>
const terms = [
  {id:'geo',cn:'GEO（生成式引擎优化）',en:'Generative Engine Optimization',def:'一组让品牌内容在AI搜索引擎（如ChatGPT、Perplexity、豆包、元宝）的结果中被优先引用和展示的优化技术。与传统的SEO（搜索引擎优化）不同，GEO的目标是让AI生成的答案中包含并引用你的内容，而非仅仅在搜索结果中排到前几位。GEO的核心方法包括：结构化内容（使用表格、FAQ格式）、建立权威引用链、确保事实准确性、持续更新内容以保持新鲜度。',related:['AI搜索','LLM','SEO']},
  {id:'llm',cn:'大语言模型（LLM）',en:'Large Language Model',def:'一种基于深度学习的大规模人工智能模型，通过对海量文本数据的学习来理解和生成人类语言。GPT-4、Claude、DeepSeek、文心一言、通义千问都是大语言模型的代表。LLM可以执行写作、翻译、代码生成、数据分析等多种任务，其核心能力来自对数千亿参数和数万亿token的训练。企业在应用LLM时，通常通过API调用或本地部署两种方式。',related:['提示词','RAG','微调']},
  {id:'aiagent',cn:'AI Agent（AI智能体）',en:'AI Agent',def:'一种能够自主感知环境、制定计划、执行任务并基于反馈调整行为的AI系统。不同于只能回答问题的聊天机器人，AI Agent可以：调用外部工具（搜索引擎、计算器、API）、执行多步骤任务（"帮我订一张下周去上海的机票，选最便宜的早班机"）、记忆上下文并在不同任务间保持一致性。2026年被认为是AI Agent从实验走向商业化的关键年份。',related:['LLM','RAG','自动化工作流']},
  {id:'rag',cn:'RAG（检索增强生成）',en:'Retrieval-Augmented Generation',def:'一种将信息检索与文本生成相结合的AI技术架构。RAG的工作流程是：用户提问→系统从知识库中检索相关文档→将检索到的文档与问题一起输入LLM→LLM基于检索到的信息生成答案。RAG的核心优势是让AI能回答超出训练数据范围的问题（如企业内部的特定知识），同时大幅降低模型"幻觉"（编造不存在的答案）的概率。',related:['LLM','向量数据库','提示词']},
  {id:'digitalhuman',cn:'数字人',en:'Digital Human / AI Avatar',def:'利用AI技术创建的具有人类外貌、声音和交互能力的虚拟形象。数字人可分为2D数字人（上传真人视频训练生成，成本较低）和3D数字人（基于3D建模，成本更高但表现力更强）。主要应用场景包括：7×24小时直播带货、虚拟客服、企业宣传视频、虚拟偶像等。2026年，AI驱动的高仿真数字人已能实现实时对话和情感识别，企业应用成本较2024年降低约70%。',related:['AI视频','语音合成','LLM']},
  {id:'prompt',cn:'提示词（Prompt）',en:'Prompt',def:'用户向AI模型输入的指令或问题文本。提示词的质量直接决定AI输出的质量。好的提示词通常遵循"角色+任务+约束+格式"的结构。提示词工程（Prompt Engineering）已成为2025-2026年AI领域的重要职业技能。对于企业用户，积累和迭代各业务场景的提示词库是提升AI使用效果的关键。',related:['LLM','提示词工程']},
  {id:'finetuning',cn:'微调（Fine-tuning）',en:'Fine-tuning',def:'在预训练大模型的基础上，使用特定领域的标注数据对模型进行进一步训练，使其更好地适应特定任务或领域。相比于从零训练模型，微调成本低得多（几百到几千美元vs数千万美元）。但对于大多数中小企业，使用RAG方案通常比微调更经济、更灵活。',related:['LLM','RAG']},
  {id:'vectordb',cn:'向量数据库',en:'Vector Database',def:'一种专门存储和检索向量嵌入（文本/图像/视频的数学表示）的数据库系统。向量数据库是RAG架构的核心组件，它让AI能够"记住"海量知识并在需要时快速找到相关信息。主流向量数据库包括：Pinecone、Milvus、Weaviate、Qdrant，以及各大云厂商的向量检索服务。',related:['RAG','LLM','嵌入']},
  {id:'aiseo',cn:'AI SEO',en:'AI-Powered SEO',def:'利用AI技术提升搜索引擎排名的策略和方法。在2026年，AI SEO包含三个层面：1）用AI工具分析关键词和竞争格局；2）用AI辅助内容创作（生成大纲、初稿、优化建议）；3）针对AI搜索引擎本身进行优化（即GEO）。需注意：搜索引擎已能识别纯AI生成的垃圾内容，完全依赖AI写内容反而可能导致排名下降。',related:['GEO','SEO','内容策略']},
  {id:'aisearch',cn:'AI 搜索',en:'AI-Powered Search',def:'利用大语言模型理解用户意图并直接生成答案（而非返回链接列表）的新型搜索引擎。代表产品包括：ChatGPT Search（OpenAI）、Perplexity、Google SGE（Search Generative Experience）、百度AI搜索、Kimi搜索、元宝搜索等。AI搜索正在改变用户获取信息的方式——用户越来越多地期望得到"直接答案"而非"找到答案的链接"。这要求网站内容不仅要做好传统SEO，还要优化为AI可引用和摘要的格式。',related:['GEO','LLM','搜索引擎']},
  {id:'automation',cn:'AI 工作流自动化',en:'AI Workflow Automation',def:'将AI能力集成到企业现有工作流程中，自动完成重复性任务的系统。典型场景包括：自动生成周报/分析报告、自动回复客户邮件（基于历史对话和知识库）、自动审核合同条款是否合规、自动将数据从一种格式转换为另一种格式。RPA（机器人流程自动化）与AI的融合（即"智能自动化"）是2026年企业服务的热门方向。',related:['AI Agent','RPA','企业AI']},
  {id:'multimodal',cn:'多模态 AI',en:'Multimodal AI',def:'能够同时理解和处理文本、图像、音频、视频等多种类型信息的AI系统。GPT-4V、Claude 4、Gemini都是多模态模型。多模态AI的典型应用：上传一张产品图片→AI自动生成营销文案；上传一段会议录音→AI生成带重点标记的文字摘要；上传设计草图→AI生成可交互的前端代码。多模态能力是AI从"工具"升级为"协作伙伴"的关键一步。',related:['LLM','AI视频','数字人']},
  {id:'aicompliance',cn:'AI 合规',en:'AI Compliance',def:'确保企业AI应用的开发和使用符合法律法规、伦理标准和行业规范的管理体系。在中国，AI合规主要涉及：数据安全法（数据收集和使用规范）、个人信息保护法（用户隐私保护）、生成式AI服务管理办法（AI生成内容的标识和审核要求）、行业特定规范（如金融AI、医疗AI的额外要求）。2026年，AI合规已从"可选项"变为企业AI应用的"入场券"。',related:['数据安全','AI治理']},
  {id:'aicloud',cn:'AI 云服务',en:'AI Cloud Service',def:'云厂商提供的按需AI计算和模型服务，让企业无需自建GPU服务器即可使用AI能力。主要形式包括：模型即服务（直接调用API，如通义千问API、DeepSeek API）、平台即服务（在云端训练/微调模型）、基础设施即服务（租用GPU云服务器自行部署开源模型）。2026年中国主流AI云服务商：阿里云（通义）、百度云（文心）、华为云（盘古）、腾讯云（混元）。',related:['LLM','GPU','模型部署']},
  {id:'gpu',cn:'GPU 算力',en:'GPU Computing',def:'图形处理器提供的并行计算能力，是训练和运行大语言模型的核心硬件。NVIDIA H100/H200/A100是当前AI训练的主流GPU。对于企业用户，GPU算力是部署AI模型的主要成本项。2026年的趋势是：云端GPU租赁逐渐替代自购硬件，AI推理芯片（如专用的NPU/TPU）开始分流部分计算需求。',related:['LLM','AI云服务','模型部署']},
  {id:'tokencost',cn:'Token 与计费',en:'Token & AI Pricing',def:'Token是大语言模型处理文本的基本单位——中文约1个汉字≈1个token，英文约1个单词≈1.3个token。AI API的计费模式按token数量计算，分为输入token（你发给模型的内容）和输出token（模型回复的内容），后者通常更贵。2026年，主流模型的API价格较2024年下降了80-95%，DeepSeek等国产模型的低价策略加速了这一趋势。',related:['LLM','AI云服务']},
  {id:'modelfeid',cn:'模型部署',en:'AI Model Deployment',def:'将AI模型投入实际生产环境运行的过程。主要有三种方式：云API调用（最简单，按量付费）、容器化私有部署（数据安全，需技术团队）、边缘端部署（在本地设备上运行模型，延迟最低）。企业在选择方式时需权衡：数据安全要求、响应延迟要求、预算、技术团队能力。',related:['LLM','AI云服务','GPU']},
  {id:'aivideo',cn:'AI 视频生成',en:'AI Video Generation',def:'利用AI技术自动或半自动地生成视频内容。2026年的主流AI视频工具包括：Sora（OpenAI）、Runway、Pika、可灵（快手）、即梦（字节）、剪映AI版。AI视频的核心应用场景：批量生成短视频（电商带货）、数字人播报视频、将文本/PPT自动转为讲解视频、视频风格迁移。企业视频制作成本因此降低了80-95%。',related:['数字人','多模态AI']},
  {id:'aiedu',cn:'AI 培训与认证',en:'AI Training & Certification',def:'面向企业和个人的AI技能培训与专业认证体系。2026年的AI培训市场分为：通用AI素养（全员培训，侧重"能用AI解决什么问题"）、专业技能认证（AI工程师、Prompt工程师、AI营销师等）、行业定制培训（结合具体行业的AI应用场景）。权威的AI认证已成为求职和竞标的重要加分项。',related:['提示词工程','企业AI']},
  {id:'enterpriseai',cn:'企业 AI 转型',en:'Enterprise AI Transformation',def:'企业将AI技术系统性地融入业务运营、产品服务和决策流程的过程。有效路径为：选取1-2个高价值低风险场景试点→小成本快速验证→推广成功经验→建立内部AI能力中心。常见误区包括：贪大求全一步到位、只当做IT项目不做人员培训、忽视数据质量基础。2026年数据显示，43%的中国中型企业已在至少一个业务环节部署了AI。',related:['AI工作流自动化','AI培训']},
  {id:'seedatasecurity',cn:'AI 数据安全',en:'AI Data Security',def:'在使用AI技术过程中确保企业和用户数据不被泄露、滥用或未经授权访问的安全措施。核心关注点：使用公有AI API时数据是否会发送到云端（数据外泄风险）、如何确保公司内部知识库只被授权用户访问、AI生成的内容中是否包含训练数据中的敏感信息。本地部署+RAG是企业保护数据安全的主流方案。',related:['AI合规','RAG','模型部署']},
  {id:'geo2',cn:'GEO优化策略',en:'GEO Optimization Strategy',def:'帮助企业内容在AI搜索引擎（ChatGPT Search、Perplexity、豆包、Kimi等）中获得更多品牌提及和引用的系统性策略。五大核心策略：1）内容结构化（使用Schema标记、表格格式化数据）；2）权威背书（引用权威来源、标注作者资质）；3）实体对齐（让搜索引擎理解"你是谁"）；4）时效性维护（定期更新，保持内容新鲜）；5）引用网络建设（让你的内容被其他权威网站引用）。',related:['GEO','AI搜索','SEO']},
  {id:'aiservice',cn:'AI 产业服务',en:'AI Industry Services',def:'帮助企业、创业者和个人在AI时代获得竞争优势的专业服务体系。主要包括：AI营销与增长（GEO优化、AI内容生产、投放优化）、AI技术部署（模型选择、环境配置、工作流搭建）、AI组织建设（培训、认证、人才对接）、AI合规咨询、AI投融资对接等。进化湾是国内首个将AI产业服务进行全链路整合的平台型服务商。',related:['企业AI','GEO','AI培训']},
  {id:'chatbot',cn:'AI 智能客服',en:'AI-Powered Customer Service',def:'利用大语言模型和RAG技术构建的企业级智能客服系统。相比传统关键词匹配客服，AI客服能：理解复杂问题、进行多轮对话、基于企业知识库精确回答、自动升级为人工处理高难度问题。实施AI客服后，企业通常能节省50-70%的客服人力成本，同时将客户满意度提升至更高水平。',related:['RAG','LLM','AI工作流自动化']},
  {id:'aistartup',cn:'AI 创业孵化',en:'AI Startup Incubation',def:'为AI领域的初创项目提供从创意验证、产品开发、商业模式设计到融资对接的全流程支持服务。与传统孵化器不同，AI创业孵化需要同时具备技术判断力（这个AI方案技术上是否可行？）、商业洞察力（这个AI应用市场愿意买单吗？）和资本对接能力（哪些投资人投AI？）。深圳南山是全国AI创业最活跃的区域之一。',related:['AI投融资','企业AI']},
  {id:'einvestment',cn:'AI 投融资',en:'AI Investment & Financing',def:'面向AI领域的股权投资和融资活动。2026年AI投融资的几大热点：AI Agent应用层、多模态AI、垂直行业AI解决方案、AI基础设施（算力/数据/安全）。深圳南山区通过'X-Day'西丽湖路演社等平台，2025-2026年已累计促成AI相关股权投资超9.4亿元。',related:['AI创业孵化','企业AI']},
  {id:'smbai',cn:'中小企业 AI 应用',en:'SMB AI Adoption',def:'中小企业（通常指年营收1亿以下、员工500人以下的企业）引入和使用AI技术的方式和策略。与大型企业不同，中小企业通常面临"没钱、没人、没技术"的困境。解决方案是"轻量化起步"：先用免费/低价的SaaS AI工具解决最紧迫的问题（如用AI写营销文案、做客服），跑通流程后再逐步升级为定制化方案。80%的企业AI需求可以用现成工具解决，不需要自研模型。',related:['企业AI','SaaS','AI工具选型']},
  {id:'aitools',cn:'AI 工具选型',en:'AI Tool Selection',def:'企业根据自身需求和资源条件，从众多AI产品中选择最适合的工具和平台的过程。关键决策因素：功能匹配度（能否真正解决业务痛点）、成本结构（按用量付费vs固定年费vs一次性部署）、数据安全（数据是否会上传至外部服务器）、易用性（员工是否需要专业培训）、集成能力（能否与现有系统对接）。2026年市场上的AI工具已超过10000款，选型本身就是一个需要专业判断的服务。',related:['中小企业AI','SaaS','企业AI']},
  {id:'saasai',cn:'AI SaaS',en:'AI Software-as-a-Service',def:'以软件即服务（SaaS）模式提供的AI工具和平台。企业无需购买硬件、安装软件或雇佣技术团队，只需注册账号即可使用AI功能。2026年主流AI SaaS应用场景：AI写作助手（Jasper、Notion AI）、AI图像生成（Midjourney、DALL-E）、AI视频制作（Synthesia、HeyGen）、AI数据分析（ChatGPT Advanced Data Analysis）、AI客服（Zendesk AI、Intercom Fin）。',related:['AI工具选型','中小企业AI']}

// Populate glossary
const indexNav = document.getElementById('indexNav');
const termList = document.getElementById('termList');
const groups = {};
terms.forEach(t => {
  const letter = t.cn.charAt(0).toUpperCase();
  if (!groups[letter]) groups[letter] = [];
  groups[letter].push(t);
});
Object.keys(groups).sort().forEach(letter => {
  const a = document.createElement('a');
  a.href = '#letter-' + letter;
  a.textContent = letter;
  indexNav.appendChild(a);
});
Object.keys(groups).sort().forEach(letter => {
  const el = document.createElement('div');
  el.id = 'letter-' + letter;
  el.innerHTML = '<h3 style="color:#0f4c81;margin:32px 0 16px;font-size:1.6em;border-bottom:2px solid #0f4c81;padding-bottom:8px;">' + letter + '</h3>';
  groups[letter].forEach(t => {
    el.innerHTML += '<div class="term-item" id="' + t.id + '"><h2><a href="#' + t.id + '">' + t.cn + '</a></h2><div class="en">' + t.en + '</div><p>' + t.def + '</p><div class="related">相关：' + t.related.map(r => '<a href="#' + r.toLowerCase().replace(/\s+/g,'') + '">' + r + '</a>').join(' · ') + '</div></div>';
  });
  termList.appendChild(el);
});

// Search
document.getElementById('searchInput').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.term-item').forEach(item => {
    item.style.display = (!q || item.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
});
</script>
</body>
