# HTTP 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.jhw-ai.com jhw-ai.com a.jhw-ai.com;
    # return 301 https://$server_name$request_uri;

     # 静态文件服务（网页、图片等）
    location / {
        root /home/ubuntu/evolution_bay/v0.3/frontend/;
        index index.html;
        try_files $uri $uri/ =404;
    }
    
    # 静态资源（二维码图片等）
    location /static/ {
        root /home/ubuntu/进化湾网站;
        expires 30d;
        access_log off;
    }
    
    # API 反向代理到 Flask 后端
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 旧版导出接口（兼容）
    location /admin/export {
        proxy_pass http://127.0.0.1:5000/admin/export;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理后台 API 代理到 Flask
    location /admin/api/ {
        proxy_pass http://127.0.0.1:5000/admin/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台 SPA 静态文件
    location /admin/ {
        root /home/ubuntu/evolution_bay/v0.3/frontend/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
    }
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jhw-ai.com jhw-ai.com;

    # SSL 证书（Let's Encrypt 申请成功后可取消注释下面两行）
    ssl_certificate /etc/ssl/certs/jhw-ai_com_chain.crt;
    ssl_certificate_key /etc/ssl/private/jhw-ai_com_private.key;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 静态文件服务（网页、图片等）
    location / {
        root /home/ubuntu/evolution_bay/v0.3/frontend/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 静态资源（二维码图片等）
    location /static/ {
        root /home/ubuntu/进化湾网站;
        expires 30d;
        access_log off;
    }

    # API 反向代理到 Flask 后端
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧版导出接口（兼容）
    location /admin/export {
        proxy_pass http://127.0.0.1:5000/admin/export;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理后台 API 代理到 Flask（必须在 /admin/ 之前匹配）
    location /admin/api/ {
        proxy_pass http://127.0.0.1:5000/admin/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台 SPA 静态文件
    location /admin/ {
        root /home/ubuntu/evolution_bay/v0.3/frontend/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
    }
}
