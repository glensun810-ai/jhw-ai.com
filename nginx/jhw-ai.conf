# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name www.jhw-ai.com jhw-ai.com a.jhw-ai.com;
    return 301 https://www.jhw-ai.com$request_uri;
}

# HTTPS — 裸域名 → www 重定向
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jhw-ai.com a.jhw-ai.com;

    ssl_certificate /etc/ssl/certs/jhw-ai_com_chain.crt;
    ssl_certificate_key /etc/ssl/private/jhw-ai_com_private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://www.jhw-ai.com$request_uri;
}

# HTTPS — 主站 www.jhw-ai.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jhw-ai.com;

    ssl_certificate /etc/ssl/certs/jhw-ai_com_chain.crt;
    ssl_certificate_key /etc/ssl/private/jhw-ai_com_private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip 压缩
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # 静态文件服务（网站首页、robots.txt、sitemap.xml 等）
    location / {
        root /home/ubuntu/evolution_bay/v0.3/frontend/;
        index index.html;
        try_files $uri $uri/ =404;
        # HTML 不缓存，确保内容实时更新
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        # 静态文本文件（robots.txt, sitemap.xml）缓存短时间
        location ~* (robots\.txt|sitemap\.xml)$ {
            add_header Cache-Control "public, max-age=86400";
        }
    }

    # 静态资源（二维码图片、logo 等）
    location /static/ {
        alias /home/ubuntu/evolution_bay/v0.3/frontend/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到 Flask 后端
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧版导出接口（兼容）
    location /admin/export {
        proxy_pass http://127.0.0.1:5000/admin/export;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理后台 API 代理到 Flask
    location /admin/api/ {
        proxy_pass http://127.0.0.1:5000/admin/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台 SPA 静态文件
    location /admin/ {
        root /home/ubuntu/evolution_bay/v0.3/frontend/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
    }
}
